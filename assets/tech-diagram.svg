<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800">
<rect width="1200" height="800" fill="#0E1419"/>
<style>
        .title{font-family:PingFang SC,Hiragino Sans GB,Microsoft YaHei,sans-serif;font-size:26px;fill:#E8EDF2;text-anchor:middle;}
        .sub{font-family:PingFang SC,Hiragino Sans GB,Microsoft YaHei,sans-serif;font-size:12px;fill:#97A3B0;text-anchor:middle;}
        .ct{font-family:PingFang SC,Hiragino Sans GB,Microsoft YaHei,sans-serif;font-size:17px;fill:#4FA89B;text-anchor:middle;font-weight:600;}
        .st{font-family:PingFang SC,Hiragino Sans GB,Microsoft YaHei,sans-serif;font-size:14px;fill:#E8EDF2;text-anchor:middle;}
        .bd{font-family:PingFang SC,Hiragino Sans GB,Microsoft YaHei,sans-serif;font-size:13px;fill:#97A3B0;}
        .arrow{font-family:PingFang SC,Hiragino Sans GB,Microsoft YaHei,sans-serif;font-size:13px;fill:#4FA89B;text-anchor:middle;}
    </style>
<text x="600" y="40" class="title">零创技术路线与交付标准</text>
<text x="600" y="74" class="sub">按场景选“能落地、能接手、可控”的方案</text>
<rect x="60" y="110" width="200" height="220" rx="12" ry="12" fill="none" stroke="#4FA89B" stroke-width="2"/>
<text x="160" y="142" class="ct">资料类需求</text>
<text x="160" y="170" class="st">检索增强</text>
<text x="74" y="202" class="bd">把资料整理成可查、可问</text>
<text x="74" y="222" class="bd">来源可追、持续可补</text>
<rect x="280" y="110" width="200" height="220" rx="12" ry="12" fill="none" stroke="#4FA89B" stroke-width="2"/>
<text x="380" y="142" class="ct">重复流程</text>
<text x="380" y="170" class="st">工作流自动化 + 人工确认</text>
<text x="294" y="202" class="bd">可控步骤半自动跑</text>
<text x="294" y="222" class="bd">例外一律交人确认</text>
<rect x="500" y="110" width="200" height="220" rx="12" ry="12" fill="none" stroke="#4FA89B" stroke-width="2"/>
<text x="600" y="142" class="ct">助手类</text>
<text x="600" y="170" class="st">限定场景的智能体</text>
<text x="514" y="202" class="bd">只读授权资料</text>
<text x="514" y="222" class="bd">关键判断交人</text>
<rect x="720" y="110" width="200" height="220" rx="12" ry="12" fill="none" stroke="#4FA89B" stroke-width="2"/>
<text x="820" y="142" class="ct">部署方式</text>
<text x="820" y="170" class="st">私有化或云端</text>
<text x="734" y="202" class="bd">按数据归属与合规选</text>
<text x="734" y="222" class="bd">敏感数据可不出本地</text>
<rect x="940" y="110" width="200" height="220" rx="12" ry="12" fill="none" stroke="#4FA89B" stroke-width="2"/>
<text x="1040" y="142" class="ct">原则</text>
<text x="1040" y="170" class="st">先小后大</text>
<text x="954" y="202" class="bd">从可验收小试点起</text>
<text x="954" y="222" class="bd">能试、能停、能放大</text>
<text x="600" y="350" class="arrow">↓ 落地为交付标准 ↓</text>
<rect x="60" y="390" width="200" height="340" rx="12" ry="12" fill="none" stroke="#4FA89B" stroke-width="2"/>
<text x="160" y="422" class="ct">验收口径</text>
<text x="74" y="452" class="bd">写清输入、输出、负责人</text>
<text x="74" y="474" class="bd">人工确认点与验收方式</text>
<text x="74" y="496" class="bd">真省时、少漏、好交接</text>
<rect x="280" y="390" width="200" height="340" rx="12" ry="12" fill="none" stroke="#4FA89B" stroke-width="2"/>
<text x="380" y="422" class="ct">交付时效</text>
<text x="294" y="452" class="bd">诊断 0.5–2h（免费）</text>
<text x="294" y="474" class="bd">小试点 2天–1周</text>
<text x="294" y="496" class="bd">标准项目 1–8周</text>
<text x="294" y="518" class="bd">深度 3月+ / 陪跑 1–6月</text>
<rect x="500" y="390" width="200" height="340" rx="12" ry="12" fill="none" stroke="#4FA89B" stroke-width="2"/>
<text x="600" y="422" class="ct">响应与异常</text>
<text x="514" y="452" class="bd">1–2 工作日响应</text>
<text x="514" y="474" class="bd">例外先停确认</text>
<text x="514" y="496" class="bd">不硬跑、不掩盖</text>
<rect x="720" y="390" width="200" height="340" rx="12" ry="12" fill="none" stroke="#4FA89B" stroke-width="2"/>
<text x="820" y="422" class="ct">交付文档</text>
<text x="734" y="452" class="bd">需求与验收单</text>
<text x="734" y="474" class="bd">操作流程说明</text>
<text x="734" y="496" class="bd">资料与权限清单</text>
<text x="734" y="518" class="bd">培训记录、交接清单</text>
<rect x="940" y="390" width="200" height="340" rx="12" ry="12" fill="none" stroke="#4FA89B" stroke-width="2"/>
<text x="1040" y="422" class="ct">陪跑与交接</text>
<text x="954" y="452" class="bd">指定对接人</text>
<text x="954" y="474" class="bd">启用、培训、复盘</text>
<text x="954" y="496" class="bd">能力留在你公司</text>
</svg>